<html>
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiche d'Inscription - Gank Innovation Center</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="form-wrapper">
        <div class="form-header">
            <h1>Gank Innovation Center</h1>
            <p>Inscrivez-vous pour rejoindre nos programmes innovants.</p>
        </div>
        <form action="#" method="post" class="registration-form">
            <div class="form-group">
                <label for="full-name">Nom complet :</label>
                <input type="text" id="full-name" name="full-name" placeholder="Entrez votre nom complet" required>
            </div>
            <div class="form-group">
                <label for="email">Adresse e-mail :</label>
                <input type="email" id="email" name="email" placeholder="Entrez votre e-mail" required>
            </div>
            <div class="form-group">
                <label for="phone">Numéro de téléphone :</label>
                <input type="tel" id="phone" name="phone" placeholder="Entrez votre numéro" required>
            </div>
            <div class="form-group">
                <label for="program">Programme choisi :</label>
                <select id="program" name="program" required>
                    <option value="">-- Choisissez un programme --</option>
                    <option value="english">English</option>
                    <option value="design">Design</option>
                    <option value="entrepreneurship">Entrepreneuriat</option>
                </select>
            </div>
            <button type="submit">S'inscrire</button>
        </form>
    </div>
</body>
</html>
